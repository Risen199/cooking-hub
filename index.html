<script>
const searchInput = document.getElementById('location-search');
const orderNowBtn = document.getElementById('order-now');
const scheduleBtn = document.getElementById('schedule-delivery');
const resultDiv = document.getElementById('result-message');

const API_URL = 'https://api.beiju.co.za';

// ✅ REMOVED: Hardcoded TOWNSHIP_MAP (no longer needed)
// ✅ KEPT: Heatmap logging for new areas
async function logToHeatmap(searchTerm) {
  try {
    await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'logHeatmap',
        Search_Term: searchTerm.trim().toLowerCase()
      })
    });
  } catch (err) {
    console.warn('Heatmap log failed:', err);
  }
}

function showResult(message, isError = false) {
  resultDiv.textContent = message;
  resultDiv.className = isError ? 'coming-soon' : '';
  resultDiv.style.display = 'block';
}

function generatePickupSlots() {
  const now = new Date();
  const open = new Date();
  open.setHours(8, 30, 0, 0);
  const close = new Date();
  close.setHours(20, 0, 0, 0);

  if (now < open) {
    return { valid: false, message: "Orders start at 8:30 AM" };
  }
  if (now >= close) {
    return { valid: false, message: "Orders start at 8:30 AM" };
  }

  let ready = new Date(now.getTime() + 60 * 60000);
  const minutes = ready.getMinutes();
  if (minutes <= 30) {
    ready.setMinutes(30, 0, 0);
  } else {
    ready.setHours(ready.getHours() + 1, 0, 0, 0);
  }

  const slots = [];
  let current = new Date(ready);
  for (let i = 0; i < 4; i++) {
    const end = new Date(current.getTime() + 30 * 60000);
    const options = { hour: 'numeric', minute: '2-digit', hour12: true };
    slots.push(`${current.toLocaleTimeString([], options)} – ${end.toLocaleTimeString([], options)}`);
    current = end;
  }

  return { valid: true, slots };
}

// ✅ SIMPLIFIED: Only Airtable API, no fallback needed
async function handleOrderNow() {
  const rawArea = searchInput.value.trim();
  if (!rawArea) {
    showResult('Please enter your area.', true);
    return;
  }

  try {
    // Use Airtable API directly
    const response = await fetch(`${API_URL}?action=searchArea&q=${encodeURIComponent(rawArea)}`);
    const data = await response.json();
    
    if (data.success && data.townshipCode) {
      // Found in Airtable
      sessionStorage.removeItem('deliveryMode');
      window.location.href = `hub.html?township=${data.townshipCode}`;
    } else {
      // Not found - log to heatmap
      showResult(`Coming soon to ${rawArea}!`, true);
      logToHeatmap(rawArea);
    }
  } catch (error) {
    console.error('Search API error:', error);
    showResult('Search service temporarily unavailable. Please try again.', true);
  }
}

// ✅ SIMPLIFIED: Schedule delivery
async function handleScheduleDelivery() {
  const rawArea = searchInput.value.trim();
  if (!rawArea) {
    showResult('Please enter your area.', true);
    return;
  }

  try {
    const response = await fetch(`${API_URL}?action=searchArea&q=${encodeURIComponent(rawArea)}`);
    const data = await response.json();
    
    let townshipCode = data.success ? data.townshipCode : null;
    
    if (!townshipCode) {
      showResult(`Coming soon to ${rawArea}!`, true);
      logToHeatmap(rawArea);
      return;
    }

    const timeInfo = generatePickupSlots();
    if (!timeInfo.valid) {
      alert(timeInfo.message);
      return;
    }

    let message = "Next available pickup windows:\n\n";
    message += timeInfo.slots.map(slot => `• ${slot}`).join('\n');
    message += "\n\nFinal pickup time will be confirmed when you choose your kitchen at checkout.\n\nProceed to select your kitchen?";

    if (confirm(message)) {
      sessionStorage.setItem('deliveryMode', 'scheduled');
      window.location.href = `hub.html?township=${townshipCode}`;
    }
  } catch (error) {
    console.error('Schedule search error:', error);
    showResult('Schedule service temporarily unavailable.', true);
  }
}

orderNowBtn.addEventListener('click', handleOrderNow);
scheduleBtn.addEventListener('click', handleScheduleDelivery);

searchInput.addEventListener('keyup', (e) => {
  if (e.key === 'Enter') {
    handleOrderNow();
  }
});
</script>

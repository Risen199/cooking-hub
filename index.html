<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mzanzi Eats — Township Food Delivered</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    :root {
      --brand-red: #ff0000;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      background: white;
      color: #1a1a1a;
    }
    .navbar {
      background: white !important;
      border-bottom: 3px solid var(--brand-red) !important;
      padding: 1rem 0;
    }
    .navbar-brand {
      color: #000 !important;
      font-weight: 900 !important;
      font-size: 1.8rem;
      letter-spacing: -1px;
    }
    .brand-red { color: var(--brand-red); }
    .hero-home {
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                  url('assets/images/image.webp') center/cover no-repeat;
      height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
    }
    .search-box {
      max-width: 600px;
      width: 100%;
      margin: 0 auto 20px;
    }
    .search-box input {
      width: 100%;
      padding: 14px 24px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 1.1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .search-box input:focus {
      outline: none;
      border-color: var(--brand-red);
      box-shadow: 0 0 15px rgba(255,0,0,0.2);
    }
    .btn-glow {
      background-color: var(--brand-red) !important;
      color: white !important;
      border: none !important;
      font-weight: 900 !important;
      padding: 16px 45px !important;
      border-radius: 8px !important;
      font-size: 1.2rem;
      width: 100%;
      margin: 8px 0;
      transition: 0.3s;
    }

    .btn-schedule {
      background-color: #4CAF50 !important;
      color: white !important;
      border: none !important;
      font-weight: 900 !important;
      padding: 16px 45px !important;
      border-radius: 8px !important;
      font-size: 1.2rem;
      width: 100%;
      margin: 8px 0;
      animation: glowing-green 2s infinite;
      transition: 0.3s;
    }

    @keyframes glowing-green {
      0% { box-shadow: 0 0 5px #4CAF50; transform: scale(1); }
      50% { box-shadow: 0 0 30px #4CAF50; transform: scale(1.05); }
      100% { box-shadow: 0 0 5px #4CAF50; transform: scale(1); }
    }
    .btn-outline-dark {
      background: transparent !important;
      color: #000 !important;
      border: 2px solid #000 !important;
      font-weight: 700 !important;
      padding: 16px 45px !important;
      border-radius: 8px !important;
      font-size: 1.2rem;
      width: 100%;
      margin: 8px 0;
    }
    .big-footer {
      background: #000 !important;
      color: white !important;
      padding: 80px 0 100px 0;
      margin-top: 50px;
    }
    .footer-logo {
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--brand-red);
    }
    #result-message {
      max-width: 600px;
      margin: 20px auto 0;
      padding: 15px;
      border-radius: 10px;
      font-weight: 600;
    }
    .coming-soon {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeaa7;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html">MZANZI<span class="brand-red">EATS</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link px-3 fw-bold" href="contact.html">PARTNER WITH US</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero-home">
    <div class="container">
      <h1 class="display-2 fw-bold mb-3">Order delivery near you</h1>
      
      <div class="search-box">
        <input 
          type="text" 
          id="location-search" 
          placeholder="Enter your area: e.g., Senwabarwana, Zone 2, Campus..." 
          autocomplete="off"
        />
      </div>

      <button class="btn btn-schedule" id="schedule-delivery">See When You Can Pick Up Your Order</button>
      <button class="btn btn-glow" id="order-now">ORDER NOW</button>

      <div id="result-message" style="display:none;"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="big-footer text-center">
    <div class="container">
      <div class="footer-logo mb-2">MZANZI<span class="text-white">EATS</span></div>
      <p class="text-white opacity-75 mb-5">Empowering Local Kitchens through Digital Excellence.</p>
      
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="p-4 rounded-4" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);">
            <p class="mb-1 small text-uppercase tracking-widest opacity-50">Developed & Managed By</p>
            <a href="https://barwanadigitals.co.za" target="_blank" class="text-decoration-none">
              <h2 class="fw-900 text-white mb-0" style="letter-spacing: 2px;">BARWANA <span class="brand-red">DIGITALS</span></h2>
            </a>
          </div>
        </div>
      </div>
      
      <p class="mt-5 small opacity-50">&copy; 2026 Barwana Digitals. Limpopo, South Africa.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
// Full area-to-township mapping
const TOWNSHIP_MAP = {
  // Blouberg
  'senwabarwana': 'blouberg-eats.html',
  'dilaeneng': 'blouberg-eats.html',
  'mashalane': 'blouberg-eats.html',
  'bochum': 'blouberg-eats.html',
  'maokeng': 'blouberg-eats.html',
  'extension 5': 'blouberg-eats.html',
  'desmond park': 'blouberg-eats.html',
  'broekman': 'blouberg-eats.html',
  'blouberg': 'blouberg-eats.html',
  // Seshego
  'zone 1': 'seshego-eats.html',
  'zone 2': 'seshego-eats.html',
  'zone 3': 'seshego-eats.html',
  'circle centre': 'seshego-eats.html',
  'seshego': 'seshego-eats.html',
  // Mankweng
  'gate 1': 'mankweng-eats.html',
  'gate 2': 'mankweng-eats.html',
  'gate 3': 'mankweng-eats.html',
  'hwiti': 'mankweng-eats.html',
  'campus': 'mankweng-eats.html',
  'mankweng': 'mankweng-eats.html'
};

const searchInput = document.getElementById('location-search');
const orderNowBtn = document.getElementById('order-now');
const scheduleBtn = document.getElementById('schedule-delivery');
const resultDiv = document.getElementById('result-message');
const API_URL = 'https://script.google.com/macros/s/AKfycbx2GHqfDnDkeVhlgCBZIjyE9EZB1AGEjJzgJ_WHEcHel1JWRp_J1zenEdq0ifkw-qb8/exec';

function normalizeArea(area) {
  return area.trim().toLowerCase();
}

function getTownshipPage(area) {
  return TOWNSHIP_MAP[normalizeArea(area)];
}

function logToHeatmap(searchTerm) {
  fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      type: 'heatmap',
      data: { Search_Term: searchTerm }
    })
  }).catch(err => console.warn('Heatmap log failed:', err));
}

function showResult(message, isError = false) {
  resultDiv.textContent = message;
  resultDiv.className = isError ? 'coming-soon' : '';
  resultDiv.style.display = 'block';
}

// ✅ NEW: Generate pickup time slots (1-hour rigid rule)
function generatePickupSlots() {
  const now = new Date();
  const open = new Date();
  open.setHours(8, 30, 0, 0);
  const close = new Date();
  close.setHours(20, 0, 0, 0); // 8:00 PM

  if (now < open) {
    return { valid: false, message: "Orders start at 8:30 AM" };
  }
  if (now >= close) {
    return { valid: false, message: "Orders start at 8:30 AM" };
  }

  // Add 60 minutes prep
  let ready = new Date(now.getTime() + 60 * 60000);
  // Round up to next 30-min mark
  const minutes = ready.getMinutes();
  if (minutes <= 30) {
    ready.setMinutes(30, 0, 0);
  } else {
    ready.setHours(ready.getHours() + 1, 0, 0, 0);
  }

  // Generate 4 slots (2 hours of windows)
  const slots = [];
  let current = new Date(ready);
  for (let i = 0; i < 4; i++) {
    const end = new Date(current.getTime() + 30 * 60000);
    const options = { hour: 'numeric', minute: '2-digit', hour12: true };
    slots.push(`${current.toLocaleTimeString([], options)} – ${end.toLocaleTimeString([], options)}`);
    current = end;
  }

  return { valid: true, slots };
}

function handleOrderNow() {
  const rawArea = searchInput.value;
  if (!rawArea.trim()) {
    showResult('Please enter your area.', true);
    return;
  }

  const page = getTownshipPage(rawArea);
  if (page) {
    sessionStorage.removeItem('deliveryMode');
    window.location.href = page;
  } else {
    showResult(`Coming soon to ${rawArea}!`, true);
    logToHeatmap(rawArea);
  }
}

// ✅ UPDATED: Handle "See When You Can Pick Up"
function handleScheduleDelivery() {
  const rawArea = searchInput.value;
  if (!rawArea.trim()) {
    showResult('Please enter your area.', true);
    return;
  }

  const page = getTownshipPage(rawArea);
  if (!page) {
    showResult(`Coming soon to ${rawArea}!`, true);
    logToHeatmap(rawArea);
    return;
  }

  const timeInfo = generatePickupSlots();
  if (!timeInfo.valid) {
    alert(timeInfo.message);
    return;
  }

  // Build message with slots
  let message = "Next available pickup windows:\n\n";
  message += timeInfo.slots.map(slot => `• ${slot}`).join('\n');
  message += "\n\nFinal pickup time will be confirmed when you choose your kitchen at checkout.\n\nProceed to select your kitchen?";

  if (confirm(message)) {
    sessionStorage.setItem('deliveryMode', 'scheduled');
    window.location.href = page;
  }
}

orderNowBtn.addEventListener('click', handleOrderNow);
scheduleBtn.addEventListener('click', handleScheduleDelivery);

searchInput.addEventListener('keyup', (e) => {
  if (e.key === 'Enter') {
    handleOrderNow();
  }
});


</script>
</body>
</html>

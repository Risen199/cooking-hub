<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Store — Mzanzi Eats</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    :root {
      --brand-red: #ff0000;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      background: white;
      color: #1a1a1a;
      padding-bottom: 120px;
    }
    .navbar {
      background: white !important;
      border-bottom: 3px solid var(--brand-red) !important;
      padding: 14px 0;
    }
    .navbar-brand {
      color: #000 !important;
      font-weight: 900 !important;
      font-size: 1.8rem;
    }
    .brand-red { color: var(--brand-red); }
    .hero {
      height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                  url('assets/images/image.webp') no-repeat center center;
      background-size: cover;
    }
    .cart-summary {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: white;
      border-top: 4px solid var(--brand-red);
      padding: 15px 0;
      z-index: 1100;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.2);
      cursor: pointer;
    }
    .menu-item {
      transition: transform 0.2s;
    }
    .menu-item:hover {
      transform: scale(1.02);
    }
    .big-footer {
      background: #000 !important;
      color: white !important;
      padding: 80px 0 100px 0;
      margin-top: 50px;
    }
    .footer-logo {
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--brand-red);
    }
    .whatsapp-float {
      position: fixed;
      width: 60px;
      height: 60px;
      bottom: 80px;
      right: 20px;
      background-color: #25D366;
      color: #fff;
      border-radius: 50px;
      text-align: center;
      font-size: 30px;
      box-shadow: 2px 2px 10px #888;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }
    #cart-drawer {
      position: fixed;
      bottom: -100%;
      left: 0;
      width: 100%;
      background: #f8f9fa;
      z-index: 2000;
      transition: bottom 0.4s ease;
      border-radius: 25px 25px 0 0;
      max-height: 75vh;
      overflow-y: auto;
      padding-bottom: 120px;
    }
    #cart-drawer.active {
      bottom: 0;
    }
    .cart-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1999;
      display: none;
    }
    .cart-overlay.active {
      display: block;
    }
    .hidden {
      display: none !important;
    }
    #menu-container {
      min-height: 200px;
    }
    .btn-checkout {
      background-color: var(--brand-red) !important;
      color: white !important;
      border: 2px solid #00000040 !important;
      padding: 12px 24px;
      font-weight: bold;
      border-radius: 8px;
    }
    .time-note {
      font-size: 0.875rem;
      color: #666;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body data-wa-number="27726515909">

  <div class="cart-overlay" id="modal-overlay"></div>

  <div id="cart-drawer">
    <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-light">
      <h5 class="mb-0 fw-bold">Your Order</h5>
      <button class="btn-close" id="close-cart"></button>
    </div>
    <div id="cart-items-list" class="p-3">
      <p class="text-muted">Your basket is empty.</p>
    </div>
    <div class="p-3" style="position: absolute; bottom: 0; width: 100%; background: white; border-top: 1px solid #eee;">
      <button class="btn btn-success w-100 py-3 btn-checkout" id="checkout-btn">CHECK OUT</button>
    </div>
  </div>

  <nav class="navbar navbar-expand-lg sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html">MZANZI<span class="brand-red">EATS</span></a>
      <a class="btn btn-outline-dark fw-bold" id="back-btn">← Back</a>
    </div>
  </nav>

  <section class="hero">
    <div class="container">
      <h1 class="display-3 fw-bold" id="store-name">Loading...</h1>
      <p class="lead fs-4" id="store-slogan"></p>
    </div>
  </section>

  <section class="py-5 bg-light">
    <div class="container">
      <h2 class="text-center mb-5 fw-bold" style="color: var(--brand-red);">Our Menu</h2>
      <div class="row g-4" id="menu-container">
        <div class="col-12 text-center py-5">
          <div class="spinner-border" role="status" style="color: var(--brand-red);">
            <span class="visually-hidden">Loading menu...</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="cart-summary shadow-lg" id="cart-summary">
    <div class="container d-flex justify-content-between align-items-center">
      <div>
        <span id="cart-count" class="badge" style="background-color: var(--brand-red);">0</span> <span class="text-muted">items</span>
        <div class="fw-bold fs-4 text-dark" id="cart-total">R0.00</div>
      </div>
      <span class="view-cart-arrow">VIEW CART →</span>
    </div>
  </div>

  <footer class="big-footer text-center">
    <div class="container">
      <div class="footer-logo mb-2">MZANZI<span class="text-white">EATS</span></div>
      <p class="text-white opacity-75 mb-5">Empowering Local Kitchens through Digital Excellence.</p>
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="p-4 rounded-4" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);">
            <p class="mb-1 small text-uppercase tracking-widest opacity-50">Developed & Managed By</p>
            <a href="https://barwanadigitals.co.za" target="_blank" class="text-decoration-none">
              <h2 class="fw-900 text-white mb-0" style="letter-spacing: 2px;">BARWANA <span class="brand-red">DIGITALS</span></h2>
            </a>
          </div>
        </div>
      </div>
      <p class="mt-5 small opacity-50">&copy; 2026 Barwana Digitals. Limpopo, South Africa.</p>
    </div>
  </footer>

  <a href="https://wa.me/27726515909" class="whatsapp-float">💬</a>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbx2GHqfDnDkeVhlgCBZIjyE9EZB1AGEjJzgJ_WHEcHel1JWRp_J1zenEdq0ifkw-qb8/exec';

    // Store hours (will be set after loading vendor)
    let storeHours = {
      opening: null,
      closing: null
    };

    // Generate 30-min pickup slots based on current time + prep rule
    function generatePickupSlots() {
      const now = new Date();
      const oneHourLater = new Date(now.getTime() + 60 * 60000);

      // Round up to next 30-min mark
      let start = new Date(oneHourLater);
      const minutes = start.getMinutes();
      if (minutes <= 30) {
        start.setMinutes(30, 0, 0);
      } else {
        start.setHours(start.getHours() + 1, 0, 0, 0);
      }

      // Parse store hours (from Google Sheets)
      const openTime = parseTime(storeHours.opening || "08:30");
      const closeTime = parseTime(storeHours.closing || "18:00");

      const openDate = new Date();
      openDate.setHours(openTime.h, openTime.m, 0, 0);
      const closeDate = new Date();
      closeDate.setHours(closeTime.h, closeTime.m, 0, 0);

      // If it's past closing, no slots
      if (now >= closeDate) {
        return { error: "Kitchen is closed. Orders reopen tomorrow." };
      }

      // Earliest slot must be after opening + 1h prep
      const earliestSlot = new Date(Math.max(start, openDate));
      if (earliestSlot >= closeDate) {
        return { error: "Too late to order. Kitchen closes soon." };
      }

      // Generate 30-min slots up to closing time
      const slots = [];
      let current = new Date(earliestSlot);
      while (current < closeDate) {
        const end = new Date(current.getTime() + 30 * 60000);
        if (end > closeDate) break;

        const options = { hour: 'numeric', minute: '2-digit', hour12: true };
        slots.push({
          start: new Date(current),
          end: new Date(end),
          label: `${current.toLocaleTimeString([], options)} – ${end.toLocaleTimeString([], options)}`
        });

        current = end;
        // Limit to ~5 slots to avoid overload
        if (slots.length >= 5) break;
      }

      if (slots.length === 0) {
        return { error: "No available pickup times." };
      }

      return { slots, firstSlot: slots[0].start };
    }

    function parseTime(timeStr) {
      // Accepts "08:30" or "8:30"
      const parts = timeStr.trim().split(':');
      return {
        h: parseInt(parts[0], 10),
        m: parseInt(parts[1], 10) || 0
      };
    }

    document.addEventListener('DOMContentLoaded', async function () {
      const urlParams = new URLSearchParams(window.location.search);
      const storeId = urlParams.get('storeId');
      const from = urlParams.get('from');
      const backButton = document.getElementById('back-btn');

      if (from === 'blouberg-eats') {
        backButton.href = 'blouberg-eats.html';
      } else if (from === 'mankweng-eats') {
        backButton.href = 'mankweng-eats.html';
      } else if (from === 'seshego-eats') {
        backButton.href = 'seshego-eats.html';
      } else {
        backButton.href = 'index.html';
      }

      if (!storeId) {
        document.getElementById('store-name').textContent = 'Store not found';
        return;
      }

      try {
        const storeRes = await fetch(`${API_URL}?action=stores`);
        const storeData = await storeRes.json();
        if (!storeData.success) throw new Error('Failed to load stores');

        const store = storeData.data.find(s => s.Store_ID === storeId);
        if (!store) {
          document.getElementById('store-name').textContent = 'Store not found';
          return;
        }

        document.getElementById('store-name').textContent = store.Name || 'Local Kitchen';
        document.getElementById('store-slogan').textContent = store.Slogan || '';
        document.body.dataset.waNumber = store.WhatsApp || '27726515909';
        
        const primaryColor = store.Primary_Color || '#ff0000';
        document.documentElement.style.setProperty('--brand-red', primaryColor);

        // ✅ Load store hours from Google Sheets
        storeHours.opening = store.Opening_Time || "08:30";
        storeHours.closing = store.Closing_Time || "18:00";

        const menuRes = await fetch(`${API_URL}?action=menu&storeId=${storeId}`);
        const menuData = await menuRes.json();
        if (!menuData.success) throw new Error('Failed to load menu');

        const menuContainer = document.getElementById('menu-container');
        if (menuData.data.length === 0) {
          menuContainer.innerHTML = `<div class="col-12 text-center py-5"><p class="text-muted">Menu coming soon!</p></div>`;
          return;
        }

        let menuHtml = '';
        menuData.data.forEach(item => {
          menuHtml += `
            <div class="col-6 col-md-3">
              <div class="menu-item bg-white rounded-3 shadow-sm p-3 text-center h-100"
                   data-id="${item.Item_ID}" data-name="${item.Item_Name}" data-price="${item.Price}">
                <img src="${item.Image_URL || 'assets/images/image.webp'}" 
                     class="w-100 rounded mb-2" style="height:140px; object-fit:cover;">
                <h6 class="fw-bold">${item.Item_Name}</h6>
                <p class="fw-bold fs-5" style="color: var(--brand-red);">R${item.Price}</p>
                <button class="btn btn-sm w-100 btn-add" style="background-color: var(--brand-red); color: white;">➕ Add to Cart</button>
              </div>
            </div>
          `;
        });
        menuContainer.innerHTML = menuHtml;

        // Initialize cart
        let cart = [];
        const cartCountEl = document.getElementById('cart-count');
        const cartTotalEl = document.getElementById('cart-total');
        const cartSummary = document.getElementById('cart-summary');
        const cartDrawer = document.getElementById('cart-drawer');
        const cartOverlay = document.getElementById('modal-overlay');
        const cartItemsList = document.getElementById('cart-items-list');

        function updateCartUI() {
          const count = cart.reduce((sum, item) => sum + item.qty, 0);
          const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
          cartCountEl.textContent = count;
          cartTotalEl.textContent = `R${total.toFixed(2)}`;

          if (count === 0) {
            cartItemsList.innerHTML = '<p class="text-muted">Your basket is empty.</p>';
          } else {
            let html = '';
            cart.forEach(item => {
              html += `
                <div class="d-flex justify-content-between align-items-center mb-3 pb-3 border-bottom">
                  <div>
                    <strong>${item.name}</strong><br>
                    <small class="text-muted">R${item.price} × ${item.qty}</small>
                  </div>
                  <div>
                    <button class="btn btn-sm btn-outline-danger remove-item" data-id="${item.id}">✕</button>
                  </div>
                </div>
              `;
            });
            cartItemsList.innerHTML = html;

            document.querySelectorAll('.remove-item').forEach(btn => {
              btn.addEventListener('click', function() {
                const id = this.dataset.id;
                const index = cart.findIndex(i => i.id === id);
                if (index > -1) {
                  if (cart[index].qty > 1) {
                    cart[index].qty--;
                  } else {
                    cart.splice(index, 1);
                  }
                  updateCartUI();
                }
              });
            });
          }
        }

        document.querySelectorAll('.btn-add').forEach(button => {
          button.addEventListener('click', function() {
            const item = this.closest('.menu-item');
            const id = item.dataset.id;
            const name = item.dataset.name;
            const price = parseFloat(item.dataset.price);

            const existing = cart.find(i => i.id === id);
            if (existing) {
              existing.qty++;
            } else {
              cart.push({ id, name, price, qty: 1 });
            }
            updateCartUI();
          });
        });

        cartSummary.addEventListener('click', function() {
          cartDrawer.classList.add('active');
          cartOverlay.classList.add('active');
        });

        document.getElementById('close-cart').addEventListener('click', function() {
          cartDrawer.classList.remove('active');
          cartOverlay.classList.remove('active');
        });

        cartOverlay.addEventListener('click', function() {
          cartDrawer.classList.remove('active');
          cartOverlay.classList.remove('active');
        });

        // ✅ NEW CHECKOUT FLOW WITH TIME SELECTION
        document.getElementById('checkout-btn').addEventListener('click', function() {
          if (cart.length === 0) return;

          const modal = document.createElement('div');
          modal.id = 'delivery-modal';
          modal.style.cssText = `
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 2001; display: flex;
            align-items: center; justify-content: center;
          `;
          modal.innerHTML = `
            <div style="background: white; border-radius: 15px; padding: 25px; width: 90%; max-width: 500px;">
              <div id="delivery-options">
                <h4 class="mb-3">How would you like to receive your order?</h4>
                <button class="btn btn-outline-primary w-100 mb-3 py-3" id="opt-collection">I'll collect from the kitchen</button>
                <button class="btn btn-outline-success w-100 mb-3 py-3" id="opt-delivery">Deliver to me</button>
                <button class="btn btn-secondary w-100 py-2" id="close-delivery-modal">Cancel</button>
              </div>
              <div id="pickup-time-selector" class="hidden">
                <h4 class="mb-3">Choose Pickup Time</h4>
                <p class="time-note">Kitchens need 1 hour to prepare your order. Pickup slots start from the next available window.</p>
                <div id="time-slots" class="mt-3"></div>
                <button class="btn btn-secondary w-100 mt-3 py-2" id="back-to-delivery">← Back</button>
              </div>
              <div id="delivery-form" class="hidden">
                <h4 class="mb-3">Delivery Details</h4>
                <input type="text" id="delivery-area" class="form-control mb-2" placeholder="Area (e.g., Zone 2, Broekman)">
                <input type="text" id="delivery-street" class="form-control mb-3" placeholder="Street/Landmark (e.g., Near Spaza)">
                <div class="form-check mb-3">
                  <input class="form-check-input" type="checkbox" id="share-location">
                  <label class="form-check-label" for="share-location">
                    I'll share my live location on WhatsApp for better delivery
                  </label>
                </div>
                <button class="btn btn-success w-100 mb-2 py-3" id="confirm-delivery">Confirm Delivery</button>
                <button class="btn btn-secondary w-100 py-2" id="back-to-delivery2">← Back</button>
              </div>
            </div>
          `;
          document.body.appendChild(modal);

          // Show delivery options
          function showOptions() {
            document.getElementById('delivery-options').classList.remove('hidden');
            document.getElementById('pickup-time-selector').classList.add('hidden');
            document.getElementById('delivery-form').classList.add('hidden');
          }

          // Show pickup time selector
          function showPickupSelector() {
            const { slots, error } = generatePickupSlots();
            const timeSlotsDiv = document.getElementById('time-slots');
            
            if (error) {
              timeSlotsDiv.innerHTML = `<p class="text-danger">${error}</p>`;
              return;
            }

            let slotsHtml = '';
            slots.forEach(slot => {
              slotsHtml += `<button class="btn btn-outline-dark w-100 mb-2 py-2 pickup-slot" data-start="${slot.start.toISOString()}">${slot.label}</button>`;
            });
            timeSlotsDiv.innerHTML = slotsHtml;

            document.querySelectorAll('.pickup-slot').forEach(btn => {
              btn.addEventListener('click', () => {
                const selectedTime = btn.textContent;
                sendOrder('Collection', '', selectedTime);
                document.body.removeChild(modal);
                cartDrawer.classList.remove('active');
                cartOverlay.classList.remove('active');
              });
            });

            document.getElementById('delivery-options').classList.add('hidden');
            document.getElementById('pickup-time-selector').classList.remove('hidden');
          }

          // Handle collection
          modal.querySelector('#opt-collection').addEventListener('click', showPickupSelector);
          
          // Handle delivery
          modal.querySelector('#opt-delivery').addEventListener('click', () => {
            document.getElementById('delivery-options').classList.add('hidden');
            document.getElementById('delivery-form').classList.remove('hidden');
          });

          // Back buttons
          modal.querySelector('#back-to-delivery').addEventListener('click', showOptions);
          modal.querySelector('#back-to-delivery2').addEventListener('click', showOptions);

          // Confirm delivery
          modal.querySelector('#confirm-delivery').addEventListener('click', () => {
            const area = document.getElementById('delivery-area').value.trim();
            const street = document.getElementById('delivery-street').value.trim();
            const shareLoc = document.getElementById('share-location').checked;
            
            let deliveryNote = '';
            if (area || street) {
              deliveryNote = `Delivery: ${area} ${street}`.trim();
            }
            if (shareLoc) {
              deliveryNote += '\n\nI will share my live location on WhatsApp once you confirm!';
            }
            sendOrder('Delivery', deliveryNote, '');
            document.body.removeChild(modal);
            cartDrawer.classList.remove('active');
            cartOverlay.classList.remove('active');
          });

          // Close modal
          modal.querySelector('#close-delivery-modal').addEventListener('click', () => {
            document.body.removeChild(modal);
          });
        });

        // Send order with optional pickup time
        function sendOrder(deliveryType, deliveryNote, pickupTime = '') {
          const lines = cart.map(i => `- ${i.name} x${i.qty} (R${(i.price * i.qty).toFixed(2)})`);
          const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
          
          let msg = `Hi! I'd like to place an order:\n${lines.join('\n')}\nTotal: R${total.toFixed(2)}`;
          
          if (pickupTime) {
            msg += `\n\nPickup window: ${pickupTime}`;
          } else if (deliveryType === 'Collection') {
            // Fallback (shouldn't happen)
            msg += `\n\nI'll collect from your kitchen.`;
          }

          if (deliveryType === 'Delivery' && deliveryNote) {
            msg += `\n\n${deliveryNote}`;
          } else if (deliveryType === 'Collection' && !pickupTime) {
            msg += `\n\nI'll collect from your kitchen.`;
          }

          const waNumber = document.body.dataset.waNumber;
          window.open(`https://wa.me/${waNumber}?text=${encodeURIComponent(msg)}`, '_blank');
        }

      } catch (error) {
        console.error('Error loading store:', error);
        document.getElementById('store-name').textContent = 'Error loading store';
        document.getElementById('menu-container').innerHTML = `<div class="col-12 text-center py-5"><p class="text-danger">Failed to load menu.</p></div>`;
      }
    });
  </script>
</body>
</html>

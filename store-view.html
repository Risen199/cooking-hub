<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Store — 9to5</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    :root {
      --brand-red: #ff0000;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      background: white;
      color: #1a1a1a;
      padding-bottom: 120px;
    }
    .navbar {
      background: white !important;
      border-bottom: 3px solid var(--brand-red) !important;
      padding: 14px 0;
    }
    .navbar-brand {
      color: #000 !important;
      font-weight: 900 !important;
      font-size: 1.8rem;
    }
    .brand-red { color: var(--brand-red); }
    .hero {
      height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                  url('assets/images/image.webp') no-repeat center center;
      background-size: cover;
      position: relative;
    }
    .hero-content {
      position: relative;
      z-index: 2;
    }
    .location-info {
      margin-top: 15px;
      font-size: 0.95rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .location-info p {
      margin: 5px 0;
      opacity: 0.95;
    }
    .cart-summary {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: white;
      border-top: 4px solid var(--brand-red);
      padding: 15px 0;
      z-index: 1100;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.2);
      cursor: pointer;
    }
    .menu-item {
      transition: transform 0.2s;
    }
    .menu-item:hover {
      transform: scale(1.02);
    }
    .big-footer {
      background: #000 !important;
      color: white !important;
      padding: 80px 0 100px 0;
      margin-top: 50px;
    }
    .footer-logo {
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--brand-red);
    }
    .whatsapp-float {
      position: fixed;
      width: 60px;
      height: 60px;
      bottom: 80px;
      right: 20px;
      background-color: #25D366;
      color: #fff;
      border-radius: 50px;
      text-align: center;
      font-size: 30px;
      box-shadow: 2px 2px 10px #888;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }
    #cart-drawer {
      position: fixed;
      bottom: -100%;
      left: 0;
      width: 100%;
      background: #f8f9fa;
      z-index: 2000;
      transition: bottom 0.4s ease;
      border-radius: 25px 25px 0 0;
      max-height: 75vh;
      overflow-y: auto;
      padding-bottom: 120px;
    }
    #cart-drawer.active {
      bottom: 0;
    }
    .cart-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1999;
      display: none;
    }
    .cart-overlay.active {
      display: block;
    }
    .hidden {
      display: none !important;
    }
    #menu-container {
      min-height: 200px;
    }
    .btn-checkout {
      background-color: var(--brand-red) !important;
      color: white !important;
      border: 2px solid #00000040 !important;
      padding: 12px 24px;
      font-weight: bold;
      border-radius: 8px;
    }
    .time-note {
      font-size: 0.875rem;
      color: #666;
      margin-top: 8px;
      text-align: center;
    }
    #item-detail-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      display: none;
      z-index: 3000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: white;
      border-radius: 15px;
      padding: 25px;
      width: 90%;
      max-width: 500px;
      text-align: center;
    }
    .view-details {
      display: block;
      margin-top: 8px;
      color: var(--brand-red);
      font-size: 0.875rem;
      text-decoration: none;
    }
  </style>
</head>
<body data-wa-number="27726515909">

  <div id="item-detail-modal">
    <div class="modal-content">
      <h4 id="detail-name"></h4>
      <p class="fw-bold fs-5" style="color: var(--brand-red);" id="detail-price"></p>
      <p id="detail-description"></p>
      <button class="btn btn-secondary mt-3" id="close-detail">Close</button>
    </div>
  </div>

  <div class="cart-overlay" id="modal-overlay"></div>

  <div id="cart-drawer">
    <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-light">
      <h5 class="mb-0 fw-bold">Your Order</h5>
      <button class="btn-close" id="close-cart"></button>
    </div>
    <div id="cart-items-list" class="p-3">
      <p class="text-muted">Your basket is empty.</p>
    </div>
    <div class="p-3" style="position: absolute; bottom: 0; width: 100%; background: white; border-top: 1px solid #eee;">
      <button class="btn btn-success w-100 py-3 btn-checkout" id="checkout-btn">CHECK OUT</button>
    </div>
  </div>

  <nav class="navbar navbar-expand-lg sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html">MZANZI<span class="brand-red">EATS</span></a>
      <a class="btn btn-outline-dark fw-bold" id="back-btn" href="index.html">← Back</a>
    </div>
  </nav>

  <section class="hero">
    <div class="hero-content container">
      <h1 class="display-3 fw-bold" id="store-name">Loading...</h1>
      <p class="lead fs-4" id="store-slogan"></p>
      <div class="location-info">
        <p id="landmarks-text"></p>
        <p id="description-text" style="font-style: italic;"></p>
      </div>
    </div>
  </section>

  <section class="py-5 bg-light">
    <div class="container">
      <h2 class="text-center mb-5 fw-bold" style="color: var(--brand-red);">Our Menu</h2>
      <div class="row g-4" id="menu-container">
        <div class="col-12 text-center py-5">
          <div class="spinner-border" role="status" style="color: var(--brand-red);">
            <span class="visually-hidden">Loading menu...</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="cart-summary shadow-lg" id="cart-summary">
    <div class="container d-flex justify-content-between align-items-center">
      <div>
        <span id="cart-count" class="badge" style="background-color: var(--brand-red);">0</span> <span class="text-muted">items</span>
        <div class="fw-bold fs-4 text-dark" id="cart-total">R0.00</div>
      </div>
      <span class="view-cart-arrow">🛒TAP HERE FOR CHECKOUT →</span>
    </div>
  </div>

  <footer class="big-footer text-center">
    <div class="container">
      <div class="footer-logo mb-2">MZANZI<span class="text-white">EATS</span></div>
      <p class="text-white opacity-75 mb-5">Empowering Local Kitchens through Digital Excellence.</p>
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="p-4 rounded-4" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);">
            <p class="mb-1 small text-uppercase tracking-widest opacity-50">Developed & Managed By</p>
            <a href="https://barwanadigitals.co.za" target="_blank" class="text-decoration-none">
              <h2 class="fw-900 text-white mb-0" style="letter-spacing: 2px;">BARWANA <span class="brand-red">DIGITALS</span></h2>
            </a>
          </div>
        </div>
      </div>
      <p class="mt-5 small opacity-50">&copy; 2026 Barwana Digitals. Limpopo, South Africa.</p>
    </div>
  </footer>

  <a href="https://wa.me/27726515909" class="whatsapp-float" id="wa-float">💬</a>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const API_URL = '/.netlify/functions/handle-order';

  let storeHours = {
    opening: "08:30",
    closing: "18:00",
    prepMinutes: 60
  };

  function generatePickupSlots() {
    const now = new Date();
    let maxPrep = 60;
    if (window.cart && window.cart.length > 0) {
      const prepTimes = window.cart.map(item => parseInt(storeHours.prepMinutes) || 60);
      maxPrep = Math.max(...prepTimes);
    }

    const readyTime = new Date(now.getTime() + maxPrep * 60000);
    let start = new Date(readyTime);
    const minutes = start.getMinutes();
    if (minutes <= 30) {
      start.setMinutes(30, 0, 0);
    } else {
      start.setHours(start.getHours() + 1, 0, 0, 0);
    }

    let openTime = parseTime(storeHours.opening || "08:30");
    let closeTime = parseTime(storeHours.closing || "18:00");
    if (isNaN(openTime.h) || isNaN(openTime.m)) openTime = { h: 8, m: 30 };
    if (isNaN(closeTime.h) || isNaN(closeTime.m)) closeTime = { h: 18, m: 0 };

    const today = new Date();
    const openDate = new Date(today.getFullYear(), today.getMonth(), today.getDate(), openTime.h, openTime.m, 0, 0);
    const closeDate = new Date(today.getFullYear(), today.getMonth(), today.getDate(), closeTime.h, closeTime.m, 0, 0);

    if (now < openDate) return { error: "Orders start at " + (storeHours.opening || "08:30") };
    if (now >= closeDate) return { error: "Kitchen is closed. Orders reopen tomorrow." };

    const earliestSlot = new Date(Math.max(start, openDate));
    if (earliestSlot >= closeDate) return { error: "Too late to order. Kitchen closes soon." };

    const slots = [];
    let current = new Date(earliestSlot);
    while (current < closeDate) {
      const end = new Date(current.getTime() + 30 * 60000);
      if (end > closeDate) break;
      const options = { hour: 'numeric', minute: '2-digit', hour12: true };
      slots.push({
        start: new Date(current),
        end: new Date(end),
        label: `${current.toLocaleTimeString([], options)} – ${end.toLocaleTimeString([], options)}`
      });
      current = end;
      if (slots.length >= 5) break;
    }
    return slots.length === 0 ? { error: "No available pickup times." } : { slots };
  }

  function parseTime(timeStr) {
    if (!timeStr) return { h: 8, m: 30 };
    let str = String(timeStr).trim();
    if (str.includes('AM') || str.includes('PM')) {
      const [timePart] = str.split(' ');
      const [hour, minute] = timePart.split(':').map(Number);
      let h = hour;
      if (str.includes('PM') && h < 12) h += 12;
      if (str.includes('AM') && h === 12) h = 0;
      return { h, m: minute || 0 };
    }
    const parts = str.split(':');
    const h = parseInt(parts[0], 10);
    const m = parseInt(parts[1], 10) || 0;
    return isNaN(h) ? { h: 8, m: 30 } : { h, m };
  }

  document.addEventListener('DOMContentLoaded', async function () {
    const urlParams = new URLSearchParams(window.location.search);
    const storeId = urlParams.get('storeId');
    const from = urlParams.get('from');
    const township = urlParams.get('township');
    const backButton = document.getElementById('back-btn');

    // ✅ FIXED: Handle dynamic hub back button
    if (from === 'hub' && township) {
      backButton.href = `hub.html?township=${township}`;
    } else {
      backButton.href = 'index.html';
    }

    if (!storeId) {
      document.getElementById('store-name').textContent = 'Store not found';
      return;
    }

    try {
      // Load store info
      const storeRes = await fetch(`${API_URL}?action=stores`);
      const storeData = await storeRes.json();
      if (!storeData.success) throw new Error('Failed to load stores');

      const store = storeData.stores.find(s => s.Store_ID === storeId);
      if (!store) {
        document.getElementById('store-name').textContent = 'Store not found';
        return;
      }

      // ✅ ADD THIS: Check if store is temporarily closed
      if (store.Temporarily_Closed) {
        // Show closure alert in hero section
        const heroContent = document.querySelector('.hero-content');
        heroContent.innerHTML += `
          <div class="alert alert-danger mt-4" role="alert">
            <h4>🚫 Temporarily Closed</h4>
            <p>${store.Status_Message || 'This kitchen is closed at the moment.'}</p>
            <p class="mb-0"><strong>You can view the menu but cannot place orders.</strong></p>
          </div>
        `;
      }

      document.getElementById('store-name').textContent = store.Name || 'Local Kitchen';
      document.getElementById('store-slogan').textContent = store.Slogan || '';
      
      // ✅ NEW: Display Landmarks and Area_Description
      if (store.Landmarks) {
        document.getElementById('landmarks-text').innerHTML = `📍 ${store.Landmarks}`;
      }
      if (store.Area_Description) {
        document.getElementById('description-text').textContent = store.Area_Description.replace(/"/g, '');
      }

      document.body.dataset.waNumber = store.WhatsApp || '27726515909';
      document.getElementById('wa-float').href = `https://wa.me/${store.WhatsApp || '27726515909'}`;
      
      const primaryColor = store.Primary_Color || '#ff0000';
      document.documentElement.style.setProperty('--brand-red', primaryColor);

      storeHours.opening = store.Opening_Time_Clean || "08:30";
      storeHours.closing = store.Closing_Time_Clean || "18:00";
      storeHours.prepMinutes = store.Prep_Time_Minutes || 60;

      // Load menu
      const menuRes = await fetch(`${API_URL}?action=menu&storeId=${storeId}`);
      const menuData = await menuRes.json();
      if (!menuData.success) throw new Error('Failed to load menu');

      const menuContainer = document.getElementById('menu-container');

      if (!menuData.menu || menuData.menu.length === 0) {
        menuContainer.innerHTML = `<div class="col-12 text-center py-5"><p class="text-muted">Menu coming soon!</p></div>`;
        return;
      }

      let menuHtml = '';
      menuData.menu.forEach(item => {
        menuHtml += `
          <div class="col-6 col-md-3">
            <div class="menu-item bg-white rounded-3 shadow-sm p-3 text-center h-100"
                data-id="${item.Item_ID}" 
                data-name="${item.Item_Name}" 
                data-price="${item.Price}"
                data-description="${item.Description || 'Delicious meal'}">
              <img src="${item.Image_URL || 'assets/images/image.webp'}" 
                  class="w-100 rounded mb-2" style="height:140px; object-fit:cover;">
              <h6 class="fw-bold">${item.Item_Name}</h6>
              <p class="fw-bold fs-5" style="color: var(--brand-red);">R${item.Price}</p>
              <a href="#" class="view-details" data-id="${item.Item_ID}">ⓘ View Details</a>
              <button class="btn btn-sm w-100 btn-add mt-2" style="background-color: var(--brand-red); color: white;">➕ Add to Cart</button>
            </div>
          </div>
        `;
      });
      menuContainer.innerHTML = menuHtml;

      // Initialize cart
      let cart = [];
      window.cart = cart;

      const cartCountEl = document.getElementById('cart-count');
      const cartTotalEl = document.getElementById('cart-total');
      const cartSummary = document.getElementById('cart-summary');
      const cartDrawer = document.getElementById('cart-drawer');
      const cartOverlay = document.getElementById('modal-overlay');
      const cartItemsList = document.getElementById('cart-items-list');

      function updateCartUI() {
        const count = cart.reduce((sum, item) => sum + item.qty, 0);
        const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        cartCountEl.textContent = count;
        cartTotalEl.textContent = `R${total.toFixed(2)}`;

        if (count === 0) {
          cartItemsList.innerHTML = '<p class="text-muted">Your basket is empty.</p>';
        } else {
          let html = '';
          cart.forEach(item => {
            html += `
              <div class="d-flex justify-content-between align-items-center mb-3 pb-3 border-bottom">
                <div>
                  <strong>${item.name}</strong><br>
                  <small class="text-muted">R${item.price} × ${item.qty}</small>
                </div>
                <div>
                  <button class="btn btn-sm btn-outline-danger remove-item" data-id="${item.id}">✕</button>
                </div>
              </div>
            `;
          });
          cartItemsList.innerHTML = html;

          document.querySelectorAll('.remove-item').forEach(btn => {
            btn.addEventListener('click', function() {
              const id = this.dataset.id;
              const index = cart.findIndex(i => i.id === id);
              if (index > -1) {
                if (cart[index].qty > 1) cart[index].qty--;
                else cart.splice(index, 1);
                updateCartUI();
              }
            });
          });
        }
      }

      // View Details Modal
      document.querySelectorAll('.view-details').forEach(link => {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          const itemDiv = this.closest('.menu-item');
          document.getElementById('detail-name').textContent = itemDiv.dataset.name;
          document.getElementById('detail-price').textContent = `R${itemDiv.dataset.price}`;
          document.getElementById('detail-description').textContent = itemDiv.dataset.description;
          document.getElementById('item-detail-modal').style.display = 'flex';
        });
      });

      document.getElementById('close-detail').addEventListener('click', () => {
        document.getElementById('item-detail-modal').style.display = 'none';
      });

      document.querySelectorAll('.btn-add').forEach(button => {
        button.addEventListener('click', function() {
          const item = this.closest('.menu-item');
          const id = item.dataset.id;
          const name = item.dataset.name;
          const price = parseFloat(item.dataset.price);
          const existing = cart.find(i => i.id === id);
          if (existing) existing.qty++;
          else cart.push({ id, name, price, qty: 1 });
          updateCartUI();
        });
      });

      cartSummary.addEventListener('click', () => {
        cartDrawer.classList.add('active');
        cartOverlay.classList.add('active');
      });

      document.getElementById('close-cart').addEventListener('click', () => {
        cartDrawer.classList.remove('active');
        cartOverlay.classList.remove('active');
      });

      cartOverlay.addEventListener('click', () => {
        cartDrawer.classList.remove('active');
        cartOverlay.classList.remove('active');
      });

      // ✅ FIXED CHECKOUT: Correct field names for Airtable
        document.getElementById('checkout-btn').addEventListener('click', function() {
      // ✅ ADD THIS: Block checkout if store is closed
      if (store.Temporarily_Closed) {
        alert(`🚫 ${store.Name} is Temporarily Closed\n\n${store.Status_Message || 'Orders are not being accepted at this time. Please check back later or try another kitchen.'}`);
        return;
      }
      
      if (cart.length === 0) return;

        const modal = document.createElement('div');
        modal.id = 'pickup-modal';
        modal.style.cssText = `
          position: fixed; top: 0; left: 0; width: 100%; height: 100%;
          background: rgba(0,0,0,0.7); z-index: 2001; display: flex;
          align-items: center; justify-content: center;
        `;
        modal.innerHTML = `
          <div style="background: white; border-radius: 15px; padding: 25px; width: 90%; max-width: 500px;">
            <h4 class="mb-3">Choose Pickup Time</h4>
            <p class="time-note">Kitchens need time to prepare your order. Pickup slots start from the next available window.</p>
            <div id="time-slots" class="mt-3"></div>
            <button class="btn btn-secondary w-100 mt-3 py-2" id="close-pickup-modal">Cancel</button>
          </div>
        `;
        document.body.appendChild(modal);

        const { slots, error } = generatePickupSlots();
        const timeSlotsDiv = document.getElementById('time-slots');
        
        if (error) {
          timeSlotsDiv.innerHTML = `<p class="text-danger">${error}</p>`;
        } else {
          let slotsHtml = '';
          slots.forEach(slot => {
            slotsHtml += `<button class="btn btn-outline-dark w-100 mb-2 py-2 pickup-slot" data-time="${slot.label}">${slot.label}</button>`;
          });
          timeSlotsDiv.innerHTML = slotsHtml;

          document.querySelectorAll('.pickup-slot').forEach(btn => {
            btn.addEventListener('click', () => {
              const selectedTime = btn.dataset.time;
              modal.innerHTML = `
                <div style="background: white; border-radius: 15px; padding: 25px; width: 90%; max-width: 500px;">
                  <h4 class="mb-3">What's your name Chomie!!</h4>
                  <p class="text-muted mb-3">We'll put this on your order (e.g., "Blessing")</p>
                  <input type="text" id="customer-name" class="form-control mb-3" placeholder="First name only" maxlength="20">
                  <button class="btn btn-success w-100 mb-2 py-3" id="confirm-name">Confirm & Send Order</button>
                  <button class="btn btn-secondary w-100 py-2" id="back-to-time">← Back to Time</button>
                </div>
              `;
              document.getElementById('back-to-time').addEventListener('click', () => {
                document.body.removeChild(modal);
                document.getElementById('checkout-btn').click();
              });
              document.getElementById('confirm-name').addEventListener('click', () => {
                const name = document.getElementById('customer-name').value.trim();
                if (!name) {
                  alert("Please enter your name.");
                  return;
                }

                // ✅ FIXED: Use pipe separator like in actual Airtable data
                const lines = cart.map(i => `- ${i.name} x${i.qty} (R${(i.price * i.qty).toFixed(2)})`);
                const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

                // ✅ FIXED: Correct field names for Airtable Messages table
                fetch(API_URL, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    action: 'order',
                    Store_ID: storeId,
                    Customer_Name: name,
                    Order_Items: lines.join('|'),
                    Total_Amount: total,
                    Pickup_Window: selectedTime,
                    Delivery_Type: 'Collection',
                    waNumber: document.body.dataset.waNumber
                  })
                })
                .then(res => res.json())
                .then(data => {
                  if (data.success && data.whatsAppUrl) {
                    window.open(data.whatsAppUrl, '_blank');
                    cart = [];
                    window.cart = cart;
                    updateCartUI();
                  } else {
                    alert("Order logging failed. Opening WhatsApp anyway...");
                    const msg = `ORDER FOR: ${name}\n${lines.join('\n')}\nTotal: R${total.toFixed(2)}\n\nPickup window: ${selectedTime}`;
                    const waNumber = document.body.dataset.waNumber.replace(/\D/g, '');
                    window.open(`https://wa.me/${waNumber}?text=${encodeURIComponent(msg)}`, '_blank');
                  }
                })
                .catch(err => {
                  console.warn("Logging failed:", err);
                  const msg = `ORDER FOR: ${name}\n${lines.join('\n')}\nTotal: R${total.toFixed(2)}\n\nPickup window: ${selectedTime}`;
                  const waNumber = document.body.dataset.waNumber.replace(/\D/g, '');
                  window.open(`https://wa.me/${waNumber}?text=${encodeURIComponent(msg)}`, '_blank');
                });

                document.body.removeChild(modal);
                cartDrawer.classList.remove('active');
                cartOverlay.classList.remove('active');
              });
            });
          });
        }

        document.getElementById('close-pickup-modal').addEventListener('click', () => {
          document.body.removeChild(modal);
        });
      });

    } catch (error) {
      console.error('Error loading store:', error);
      document.getElementById('store-name').textContent = 'Error loading store';
      document.getElementById('menu-container').innerHTML = `<div class="col-12 text-center py-5"><p class="text-danger">Failed to load menu.</p></div>`;
    }
  });
</script>
</body>
</html>

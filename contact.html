<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | BLOUBERG EATS</title>
  <!-- Tailwind CSS CDN for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Import Inter font for a modern look -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #000;
      color: #fff;
      overflow-x: hidden; /* Prevents horizontal scrolling */
      position: relative;
    }

    /* Styles for the sparkle canvas to cover the entire background */
    .sparkle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* Hide form-status element by default */
    #form-status {
        display: none;
    }
  </style>
</head>
<body class="bg-black text-white">
  <!-- Sparkle Canvas - This will be handled by your sparkles.js file -->
  <canvas class="sparkle-canvas" id="sparkleCanvas"></canvas>

  <!-- Contact Content Wrapper -->
  <div class="relative z-10 min-h-screen flex flex-col items-center justify-center p-4 sm:p-8">
    
    <!-- Contact Details Section -->
    <div class="text-center mb-10 w-full max-w-2xl">
      <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold mb-4">Contact Blouberg Eats</h1>
      <p class="text-lg sm:text-xl font-light mb-2">
        We're here to help! Feel free to reach out to us with any questions or inquiries.
      </p>
      
      <!-- Contact Info List -->
      <div class="flex flex-col sm:flex-row items-center justify-center gap-4 text-center mt-6 text-gray-300">
        <div class="flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-[#ff7f00]">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
          </svg>
          <span>Mon - Sat: 08:00 – 17:00</span>
        </div>
        <div class="flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-[#ff7f00]">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.18.448l-1.423 1.907c-.198.29-.306.6-.418.902a23.882 23.882 0 0 1-6.79-6.79c-.302-.112-.612-.22-.902-.418l-1.907-1.423c-.393-.278-.558-.74-.448-1.18L3.654 2.924a1.875 1.875 0 0 1 1.091-.852h1.372c.516 0 .966.351 1.091.852l1.106 4.423c.11.44-.055.902-.448 1.18Z" />
          </svg>
          <a href="tel:+27 79 932 9192" class="hover:underline">+27 79 932 9192</a>
        </div>
        <div class="flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-[#ff7f00]">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
          </svg>
          <a href="mailto:paintersdomain.enquiries@gmail.com" class="hover:underline">bloubergeats.enquiries@gmail.com</a>
        </div>
      </div>
    </div>

    <!-- Contact Form Section -->
    <form class="w-full max-w-lg mx-auto bg-gray-800 bg-opacity-30 backdrop-blur-sm p-6 sm:p-8 rounded-xl shadow-lg border border-gray-700" action="https://formspree.io/f/xkgzpkyp" method="POST" id="tsapiForm">
      <div class="mb-4">
        <label for="name" class="block text-sm font-medium mb-1">Your Name</label>
        <input type="text" name="name" id="name" placeholder="John Doe" required 
               class="w-full p-3 rounded-md bg-gray-700 bg-opacity-50 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-[#ff7f00]" />
      </div>
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium mb-1">Your Email</label>
        <input type="email" name="email" id="email" placeholder="john.doe@example.com" required 
               class="w-full p-3 rounded-md bg-gray-700 bg-opacity-50 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-[#ff7f00]" />
      </div>
      <div class="mb-6">
        <label for="message" class="block text-sm font-medium mb-1">Your Message</label>
        <textarea name="message" id="message" rows="4" placeholder="How can we help you?" required 
                  class="w-full p-3 rounded-md bg-gray-700 bg-opacity-50 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-[#ff7f00]"></textarea>
      </div>
      
      <!-- Submission button -->
      <button type="submit" class="w-full py-3 px-6 bg-[#ff7f00] text-black font-bold rounded-full transition-all duration-300 transform hover:scale-105 hover:bg-opacity-90">
        Send Message
      </button>

      <!-- Status message for form submission -->
      <div id="form-status" class="mt-4 text-center text-sm font-bold"></div>
    </form>

    <!-- Back to Home Link -->
    <a href="index.html" class="mt-8 text-white font-medium hover:underline text-center flex items-center gap-2 transition-all duration-300 transform hover:scale-105">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
      </svg>
      Back to Homepage
    </a>

  </div>

  <!-- Form Submission JavaScript -->
  <script>
    const form = document.getElementById('tsapiForm');
    const status = document.getElementById('form-status');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const data = new FormData(form);
      const response = await fetch(form.action, {
        method: form.method,
        body: data,
        headers: {
          'Accept': 'application/json'
        }
      });

      // Show the status message
      status.style.display = 'block';

      if (response.ok) {
        status.textContent = "✅ Message sent successfully!";
        status.style.color = "lime";
        form.reset();
      } else {
        status.textContent = "❌ Message failed. Please try again.";
        status.style.color = "red";
      }
    });
  </script>
  
  <!-- Sparkles.js is not included here, you will create this file yourself. -->
  <script src="js/sparkles.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | 9to5</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #000;
      color: #fff;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Sparkle canvas */
    .sparkle-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 0 !important;
      pointer-events: none !important;
    }

    /* Form status */
    #form-status {
      display: none;
    }
    
    /* Orange brand color */
    .brand-orange {
      color: #ff7f00;
    }
  </style>
</head>
<body class="bg-black text-white">
  <!-- Sparkle Canvas -->
  <canvas class="sparkle-canvas" id="sparkleCanvas"></canvas>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg sticky-top shadow-sm bg-white">
    <div class="container py-3">
      <a class="navbar-brand fw-bold fs-3 text-dark" href="index.html">
        9to<span class="brand-orange">5</span>
      </a>
    </div>
  </nav>

  <!-- Contact Content - COMPACT LAYOUT -->
  <div class="relative z-10 min-h-screen flex flex-col items-center p-4 sm:p-6">
    
    <!-- Title & Contact Info - SIMPLIFIED -->
    <div class="text-center mb-6 w-full max-w-2xl">
      <h1 class="text-3xl sm:text-4xl font-extrabold mb-3">
        Contact <span class="brand-orange">9to5</span>
      </h1>
      <p class="text-gray-300 mb-6">
        Questions? Partner inquiries? We're here to help.
      </p>
      
      <!-- Compact Contact Info -->
      <div class="flex flex-wrap justify-center gap-4 mb-8">
        <div class="flex items-center gap-2 text-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 brand-orange" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span>Mon-Sat: 8AM-5PM</span>
        </div>
        <div class="flex items-center gap-2 text-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 brand-orange" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
          </svg>
          <a href="tel:+27799329192" class="hover:underline">+27 79 932 9192</a>
        </div>
        <div class="flex items-center gap-2 text-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 brand-orange" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
          <a href="mailto:bloubergeats.enquiries@gmail.com" class="hover:underline truncate">bloubergeats.enquiries@gmail.com</a>
        </div>
      </div>
    </div>

    <!-- Contact Form - SIMPLER DESIGN -->
    <form class="w-full max-w-md mx-auto bg-black/70 border border-orange-900/40 p-6 rounded-xl shadow-lg" 
          action="https://formspree.io/f/xkgzpkyp" method="POST" id="tsapiForm">
      
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1 text-gray-300">Your Name</label>
        <input type="text" name="name" required 
               class="w-full p-3 rounded-lg bg-black/50 border border-gray-700 text-white 
                      focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500" 
               placeholder="John Doe">
      </div>
      
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1 text-gray-300">Your Email</label>
        <input type="email" name="email" required 
               class="w-full p-3 rounded-lg bg-black/50 border border-gray-700 text-white 
                      focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500" 
               placeholder="john@example.com">
      </div>
      
      <div class="mb-6">
        <label class="block text-sm font-medium mb-1 text-gray-300">Your Message</label>
        <textarea name="message" rows="4" required 
                  class="w-full p-3 rounded-lg bg-black/50 border border-gray-700 text-white 
                         focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500" 
                  placeholder="How can we help you?"></textarea>
      </div>
      
      <button type="submit" 
              class="w-full py-3 bg-orange-600 hover:bg-orange-700 text-white font-bold rounded-lg 
                     transition duration-300">
        Send your Message
      </button>

      <div id="form-status" class="mt-4 text-center text-sm"></div>
    </form>

    <!-- Back to Home -->
    <a href="index.html" class="mt-8 text-gray-400 hover:text-white transition flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      Back to Home
    </a>

  </div>

  <!-- Simple Form Script -->
  <script>
    const form = document.getElementById('tsapiForm');
    const status = document.getElementById('form-status');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      
      const submitBtn = form.querySelector('button[type="submit"]');
      const originalText = submitBtn.textContent;
      submitBtn.textContent = 'Sending...';
      submitBtn.disabled = true;
      
      const data = new FormData(form);
      
      try {
        const response = await fetch(form.action, {
          method: form.method,
          body: data,
          headers: { 'Accept': 'application/json' }
        });

        status.style.display = 'block';
        
        if (response.ok) {
          status.textContent = "✅ Message sent! We'll contact you soon.";
          status.style.color = "#10B981";
          form.reset();
        } else {
          status.textContent = "❌ Failed to send. Please try again.";
          status.style.color = "#EF4444";
        }
      } catch (error) {
        status.textContent = "⚠️ Network error. Please try again.";
        status.style.color = "#F59E0B";
        status.style.display = 'block';
      } finally {
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
      }
    });
  </script>
  
  <!-- Sparkles Script -->
  <script src="js/sparkles.js"></script>

  <script>
  // Force sparkles canvas to be visible
  window.addEventListener('load', function() {
    const canvas = document.getElementById('sparkleCanvas');
    if (canvas) {
      canvas.style.zIndex = '0';
      canvas.style.opacity = '1';
    }
  });
</script>

</body>
</html>
